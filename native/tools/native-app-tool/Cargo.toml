edition.workspace = true
license.workspace = true

[[bin]]
name = "anodrel-native-app-tool"
path = "src/main.rs"

[dev-dependencies]
anodrel-core = { path = "../../crates/core" }
anodrel-menu = { path = "../../crates/menu" }
