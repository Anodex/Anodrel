[package]
name = "anodrel-product-fixture"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "anodrel-product-fixture"
path = "src/main.rs"

[dependencies]
anodrel-bootstrap = { path = "../../crates/bootstrap" }
anodrel-json = { path = "../../crates/json" }
